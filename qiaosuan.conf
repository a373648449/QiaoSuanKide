# 放到服务器：/etc/nginx/conf.d/qiaosuan.conf
# 检查并重载：nginx -t && nginx -s reload
#
# Python 只监听本机，不要占 5518：
#   HOST=127.0.0.1
#   PORT=8090
#   python3 server.py

server {
    listen 5518;
    server_name kind.paomiantv.cn;
    charset utf-8;

    root /home/guoqiang/QiaoSuanKide;
    index index.html;

    autoindex off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options nosniff;

    # 只允许家里这两个出口 IP
    allow 58.34.184.222/32;
    allow 58.20.123.49/32;
    deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
