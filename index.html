<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f9ff">
    <title>20以内｜凑十破十动画版</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
    <div class="hero">
        <button type="button" class="mascot" id="mascotBtn" onclick="cheerMascot()" title="点我抱抱">
            <img src="hug.gif" alt="抱抱小熊">
        </button>
        <div>
            <h1 class="title">20以内数学闯关</h1>
            <p class="hero-tip">点小熊会给你加油</p>
        </div>
    </div>

    <div class="status">
        <span>⭐星星：<span id="star">0</span></span>
        <span>今日：<span id="todayCount">0</span></span>
    </div>

    <div class="level-pick">
        <span>换关卡</span>
        <select id="parentLv" onchange="jumpLevel(+this.value)"></select>
    </div>

    <div class="tabs">
        <button onclick="switchTab('game')" id="tabGame" class="tab tab-active">练习闯关</button>
        <button onclick="switchTab('error')" id="tabError" class="tab">📒错题本</button>
        <button onclick="switchTab('report')" id="tabReport" class="tab">📊今日报告</button>
    </div>

    <div id="panelGame">
        <div id="levelInfo" class="level-info"></div>
        <div class="progress-track">
            <div id="progress" class="progress-bar"></div>
        </div>

        <div class="play-board">
            <div class="play-q">
                <div id="story" class="story"></div>
                <div id="qBox" class="equation"></div>
                <div class="ans-wrap">
                    <div class="react-slot" aria-hidden="true"></div>
                    <div id="ansBox" class="ans-box">?</div>
                    <div id="reactPop" class="react-pop hidden" aria-hidden="true"></div>
                </div>
                <div id="msg" class="msg"></div>
            </div>
            <div class="play-keys">
                <div class="keypad" id="keypad"></div>
                <div class="actions">
                    <button onclick="showSolution(true)" class="btn btn-hint">听思路</button>
                    <button onclick="nextQuestion(true)" id="btnNext" class="btn btn-next">下一题</button>
                </div>
            </div>
        </div>

        <div id="tipBox" class="tip hidden">
            <button type="button" class="btn-replay" onclick="replaySolution()">🔊 再听一遍</button>
            <div id="solutionText" class="solution-text"></div>
            <div id="framesWrap" class="frames"></div>
            <div id="tray" class="tray"></div>
            <div id="solutionAnimation" class="solution-blocks"></div>
            <div id="splitInfo" class="split-info"></div>
        </div>
    </div>

    <div id="panelError" class="hidden">
        <h2 class="panel-title">📒错题本</h2>
        <p class="hint">先自己再做一遍。想不起来再看思路，做对就会移走。</p>
        <div id="errorList" class="error-list"></div>
        <div id="errorEmpty" class="error-empty">暂时还没有错题，加油💪</div>
        <button onclick="clearAllError()" class="btn-clear">清空全部错题</button>
    </div>

    <div id="panelReport" class="hidden">
        <h2 class="panel-title">📊今日学习报告</h2>
        <div class="report-list">
            <div class="report-item slate">今日总题数：<span id="repTotal">0</span></div>
            <div class="report-item green">答对：<span id="repRight">0</span></div>
            <div class="report-item rose">答错：<span id="repWrong">0</span></div>
            <div class="report-item amber">今日正确率：<span id="repAcc">0%</span></div>
            <div class="report-item blue">当前闯关进度：第<span id="repLv">1</span>关</div>
            <div class="report-item orange">错题本还剩：<span id="repErr">0</span>道</div>
        </div>
        <div class="coach-box">
            <h3 class="coach-title">🐻 小熊老师</h3>
            <p id="coachKid" class="coach-kid">今天练完后，让小熊看一看。</p>
            <p id="coachParent" class="parent-tip"></p>
            <div class="coach-actions">
                <button type="button" class="btn-coach" id="btnAnalyze" onclick="askBear()">小熊分析</button>
                <button type="button" class="btn-coach-go" onclick="startCoachPractice()">按小熊安排练</button>
            </div>
            <p id="coachStatus" class="parent-tip"></p>
        </div>
        <div class="parent-box">
            <label class="check-row">
                <input id="soundChk" type="checkbox" onchange="toggleSound(this.checked)"> 语音讲解
            </label>
            <label class="field" id="voiceRow">
                朗读声音
                <select id="voiceSel" onchange="setVoice(this.value)"></select>
            </label>
            <label class="field">
                朗读速度
                <select id="paceSel" onchange="setSpeechPace(this.value)">
                    <option value="slow">慢一点（听思路更清楚）</option>
                    <option value="normal">适中</option>
                </select>
            </label>
            <button type="button" class="btn-preview" onclick="previewVoice()">试听声音</button>
            <p class="parent-tip">已接讯飞「小燕」。同一句话会缓存，不占次数。连不上时才用浏览器自带声音。</p>
            <button type="button" class="btn-reset" onclick="resetAllProgress()">一键清空全部进度</button>
            <p class="parent-tip">会清掉星星、关卡、今日记录和错题本，方便重新练。</p>
        </div>
        <div class="note">每天看一眼正确率和错题。想练多久都可以，累了再停。</div>
    </div>

    <div id="rewardPop" class="modal hidden">
        <div class="modal-card">
            <img class="reward-gif" src="hug.gif" alt="抱抱小熊">
            <h3 class="panel-title">关卡通关！</h3>
            <p id="rewardText"></p>
            <button onclick="closeReward()" class="btn-continue">继续闯关</button>
        </div>
    </div>
</div>

<script>
const levels = [
    {name:"10以内加法", max:10, targetAcc:0.8, onlyAdd:true},
    {name:"10以内减法", max:10, targetAcc:0.8, onlySub:true},
    {name:"10以内加减混合", max:12, targetAcc:0.8, mix10:true},
    {name:"20以内不进位加法", max:12, targetAcc:0.8, noCarryAdd:true},
    {name:"20以内不退位减法", max:12, targetAcc:0.8, noBorrowSub:true},
    {name:"20以内进位加法【凑十法】", max:15, targetAcc:0.8, carryAdd:true},
    {name:"20以内退位减法【破十法】", max:15, targetAcc:0.8, borrowSub:true},
    {name:"20以内进退位混合挑战", max:18, targetAcc:0.75, mix20:true}
]

let state = {
    star: 0,
    currentLv: 0,
    doneInLv: 0,
    rightInLv: 0,
    todayCount: 0,
    todayRight: 0,
    todayWrong: 0,
    todayDate: "",
    errorBook: [],
    sound: true,
    voiceName: "",
    speechPace: "slow",
    allClear: false,
    a: 0, b: 0, opt: "+", ans: 0,
    input: "",
    firstTry: true,
    resolved: false,
    fromError: -1,
    lastKey: "",
    solutionLines: [],
    usedHint: false,
    todayLog: [],
    coachPlan: null,
    coachQueue: [],
    coachMode: false,
    usedKeysInLv: []
}

let aniToken = 0
const timers = []
const spokenUtterances = []
let resumeWatch = null
let bearTts = false
const ttsPlayer = new Audio()
ttsPlayer.preload = "auto"

function todayStr() {
    const d = new Date()
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
}
function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min
}
function later(fn, ms) {
    const id = setTimeout(fn, ms)
    timers.push(id)
    return id
}
function clearTimers() {
    timers.splice(0).forEach(clearTimeout)
    aniToken++
    stopSpeech()
}

function stopSpeech() {
    try {
        ttsPlayer.pause()
        ttsPlayer.removeAttribute("src")
        ttsPlayer.load()
    } catch (e) {}
    if (!window.speechSynthesis) return
    try { speechSynthesis.cancel() } catch (e) {}
}

function kickSpeech() {
    if (!window.speechSynthesis) return false
    try { speechSynthesis.resume() } catch (e) {}
    if (!resumeWatch) {
        resumeWatch = setInterval(() => {
            try {
                if (speechSynthesis.speaking && speechSynthesis.paused) speechSynthesis.resume()
            } catch (e) {}
        }, 250)
    }
    return true
}

const ZH_NUM = ["零","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"]

function listZhVoices() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : []
    return voices.filter(v => {
        const blob = (v.lang || "") + " " + (v.name || "")
        return /zh|Chinese|中文|普通话|国语|Mandarin|Xiaoxiao|Ting-?Ting|Mei-?Jia|Huihui/i.test(blob)
    })
}

function scoreZhVoice(v) {
    const name = v.name || ""
    const lang = v.lang || ""
    let s = 1
    if (/zh-CN|zh_CN|cmn-Hans|普通话/i.test(lang + name)) s += 50
    else if (/zh-TW|zh_TW|cmn-Hant/i.test(lang + name)) s += 16
    else if (/zh-HK|yue|粤/i.test(lang + name)) s += 6
    if (/Neural|Natural|Online|Enhanced|Premium|增强|自然/i.test(name)) s += 90
    if (/Xiaoxiao|Xiaoyi|Yunxi|Yunyang|Xiaohan|Xiaomo|Xiaoxuan|Xiaoshuang|Yunjian|Yunxia/i.test(name)) s += 80
    if (/Google/i.test(name) && /普通话|Mandarin|中国|zh-CN/i.test(name + lang)) s += 60
    if (/Ting-?Ting/i.test(name) && /Enhanced|增强/i.test(name)) s += 45
    else if (/Ting-?Ting/i.test(name)) s += 12
    if (/Li-?Mu|Lisheng|Yu-?shu|Lilian/i.test(name)) s += 28
    if (/Mei-?Jia/i.test(name)) s += 10
    if (/Huihui|Yaoyao|Hanhan/i.test(name)) s -= 55
    if (/Desktop|Compact|SAPI/i.test(name) && !/Enhanced|Natural|Neural/i.test(name)) s -= 18
    if (v.localService) s += 4
    return s
}

function niceVoiceName(v) {
    const n = v.name || ""
    if (/Xiaoxiao/i.test(n)) return "晓晓（较自然）"
    if (/Xiaoyi/i.test(n)) return "晓伊"
    if (/Yunxi/i.test(n)) return "云希"
    if (/Google/i.test(n) && /普通话|Mandarin|中国|zh-CN/i.test(n + (v.lang || ""))) return "Google 普通话"
    if (/Ting-?Ting/i.test(n)) return /Enhanced|增强/i.test(n) ? "婷婷增强版" : "婷婷"
    if (/Huihui/i.test(n)) return "慧慧（系统旧声，不太好听）"
    if (/Yaoyao/i.test(n)) return "瑶瑶（系统旧声）"
    if (/Mei-?Jia/i.test(n)) return "美佳（台湾腔）"
    return n.replace(/^Microsoft\s+/i, "").replace(/\s*Online\s*\(Natural\)/i, " 自然")
}

function pickZhVoice() {
    const voices = listZhVoices()
    if (!voices.length) return null
    if (state.voiceName) {
        const chosen = voices.find(v => v.name === state.voiceName)
        if (chosen) return chosen
    }
    voices.sort((a, b) => scoreZhVoice(b) - scoreZhVoice(a))
    return voices[0]
}

function fillVoiceSelect() {
    const sel = document.getElementById("voiceSel")
    const wrap = document.getElementById("voiceRow")
    if (!sel) return
    const voices = listZhVoices().slice().sort((a, b) => scoreZhVoice(b) - scoreZhVoice(a))
    const opts = []
    if (bearTts) opts.push('<option value="xfyun">小熊老师（讯飞小燕）</option>')
    voices.forEach(v => {
        const rec = !bearTts && v.name === (voices[0] && voices[0].name) ? "（推荐）" : ""
        opts.push(`<option value="${v.name.replace(/"/g, "")}">${niceVoiceName(v)}${rec}</option>`)
    })
    if (!opts.length) {
        if (wrap) wrap.classList.add("hidden")
        return
    }
    if (wrap) wrap.classList.remove("hidden")
    if (!state.voiceName) state.voiceName = bearTts ? "xfyun" : (voices[0] && voices[0].name) || ""
    sel.innerHTML = opts.join("")
    const names = ["xfyun"].concat(voices.map(v => v.name))
    if (names.indexOf(state.voiceName) >= 0) sel.value = state.voiceName
}

function setVoice(name) {
    state.voiceName = name
    saveData()
}

function setSpeechPace(pace) {
    state.speechPace = pace === "normal" ? "normal" : "slow"
    saveData()
}

function previewVoice() {
    if (!primeSpeech()) return
    speak("八加六，等于十四。答对啦。")
}

function forSpeech(text) {
    let s = String(text).replace(/[👉⭐]/g, "")
    s = s.replace(/[＋]/g, "加").replace(/[－−]/g, "减")
    s = s.replace(/\d+/g, m => {
        const n = Number(m)
        return (n >= 0 && n <= 20 && ZH_NUM[n]) ? ZH_NUM[n] : m
    })
    s = s.replace(/等于/g, "，等于").replace(/，+/g, "，").replace(/^，/, "")
    if (!/[。！？]$/.test(s)) s += "。"
    return s
}

function voiceProsody(voice) {
    const name = (voice && voice.name) || ""
    if (/Neural|Natural|Online|Xiaoxiao|Xiaoyi|Yunxi|Google|Enhanced|增强/i.test(name)) {
        return {rate: 0.94, pitch: 1.04}
    }
    if (/Huihui|Yaoyao|Hanhan|Desktop|Compact/i.test(name)) {
        return {rate: 0.88, pitch: 1.08}
    }
    return {rate: 0.92, pitch: 1.06}
}

function makeUtterance(text) {
    const u = new SpeechSynthesisUtterance(forSpeech(text))
    u.lang = "zh-CN"
    u.volume = 1
    const v = pickZhVoice()
    if (v) {
        u.voice = v
        if (v.lang) u.lang = v.lang
    }
    const p = voiceProsody(v)
    const pace = state.speechPace === "normal" ? 1 : 0.9
    u.rate = Math.max(0.7, Math.min(1.05, p.rate * pace))
    u.pitch = p.pitch
    spokenUtterances.push(u)
    if (spokenUtterances.length > 12) spokenUtterances.shift()
    return u
}

function useCloudVoice() {
    return bearTts && (state.voiceName === "xfyun" || !state.voiceName)
}

function playTtsBlob(blob) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob)
        const finish = (ok) => {
            URL.revokeObjectURL(url)
            ttsPlayer.onended = null
            ttsPlayer.onerror = null
            if (ok) resolve()
            else reject(new Error("play"))
        }
        ttsPlayer.onended = () => finish(true)
        ttsPlayer.onerror = () => finish(false)
        ttsPlayer.src = url
        const p = ttsPlayer.play()
        if (p && p.catch) p.catch(() => finish(false))
    })
}

function speakCloud(text) {
    return fetch("/api/speak", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: forSpeech(text), pace: state.speechPace || "slow"})
    }).then(res => {
        if (!res.ok) throw new Error("tts")
        return res.blob()
    }).then(playTtsBlob)
}

function primeSpeech() {
    state.sound = true
    const box = document.getElementById("soundChk")
    if (box) box.checked = true
    if (bearTts) return true
    if (!window.speechSynthesis) {
        alert("当前浏览器不能朗读，请用 iPad 的 Safari，或电脑上的 Chrome")
        return false
    }
    kickSpeech()
    return true
}

function speakBrowser(text) {
    if (!window.speechSynthesis || !text) return
    kickSpeech()
    const u = makeUtterance(text)
    try { speechSynthesis.speak(u) } catch (e) {}
    try { speechSynthesis.resume() } catch (e) {}
}

function speak(text) {
    if (!state.sound || !text) return
    if (useCloudVoice()) {
        speakCloud(text).catch(() => speakBrowser(text))
        return
    }
    speakBrowser(text)
}

function speakOne(text) {
    return new Promise(resolve => {
        if (!state.sound || !text) return resolve()
        const fallback = () => {
            if (!window.speechSynthesis) return resolve()
            kickSpeech()
            const u = makeUtterance(text)
            let done = false
            const finish = () => {
                if (done) return
                done = true
                resolve()
            }
            u.onend = finish
            u.onerror = finish
            const waitMs = Math.min(10000, 800 + String(text).length * 280)
            const t = setTimeout(finish, waitMs)
            timers.push(t)
            try { speechSynthesis.speak(u) } catch (e) { finish() }
            try { speechSynthesis.resume() } catch (e) {}
        }
        if (useCloudVoice()) {
            speakCloud(text).then(resolve).catch(fallback)
            return
        }
        fallback()
    })
}

async function speakLines(lines) {
    if (!lines || !lines.length) return
    for (const line of lines) {
        await speakOne(line)
    }
}

function setSpeakStatus(on) {
    const btn = document.querySelector(".btn-replay")
    if (!btn) return
    btn.textContent = on ? "🔊 正在朗读…" : "🔊 再听一遍"
}

function replaySolution() {
    if (!primeSpeech()) return
    if (!state.solutionLines.length) {
        showSolution(true)
        return
    }
    setSpeakStatus(true)
    speakLines(state.solutionLines).then(() => setSpeakStatus(false))
}

function saveData() {
    const {input, firstTry, resolved, fromError, solutionLines, usedHint, ...rest} = state
    localStorage.setItem("math20data", JSON.stringify(rest))
}
function loadData() {
    const str = localStorage.getItem("math20data")
    if (!str) return
    try {
        const d = JSON.parse(str)
        state = {...state, ...d}
    } catch (e) {}
    if (!Array.isArray(state.todayLog)) state.todayLog = []
    if (!Array.isArray(state.coachQueue)) state.coachQueue = []
    if (!Array.isArray(state.usedKeysInLv)) state.usedKeysInLv = []
    if (state.speechPace !== "normal") state.speechPace = "slow"
    if (typeof state.voiceName !== "string") state.voiceName = ""
    if (state.todayDate !== todayStr()) {
        state.todayCount = 0
        state.todayRight = 0
        state.todayWrong = 0
        state.todayLog = []
        state.todayDate = todayStr()
    }
    if (state.currentLv >= levels.length) {
        state.currentLv = levels.length - 1
        state.allClear = true
    }
}

function buildSolutionLines(a, b, ans, op) {
    if (op === "+") {
        const big = Math.max(a, b)
        const small = Math.min(a, b)
        const need = 10 - big
        const carry = big < 10 && small > need && need > 0
        if (!carry) {
            return [`${a}加${b}`, "把两堆合在一起数", `${a}加${b}等于${ans}`]
        }
        const rest = small - need
        return [
            `${a}加${b}，用凑十法`,
            `看大数${big}，还差${need}就到10`,
            `把${small}分成${need}和${rest}`,
            `${big}加${need}等于10`,
            `10加${rest}等于${ans}`
        ]
    }
    const ones = a % 10
    const borrow = ones > 0 && ones < b && b <= 9 && a >= 10
    if (!borrow) {
        return [`${a}减${b}`, `个位够减，从${a}里面划掉${b}个`, `${a}减${b}等于${ans}`]
    }
    return [
        `${a}减${b}，用破十法`,
        `个位${ones}不够减${b}`,
        `把${a}分成10和${ones}`,
        `先算10减${b}等于${10 - b}`,
        `${10 - b}再加${ones}等于${ans}`
    ]
}

function switchTab(tab) {
    const panels = {game:"panelGame", error:"panelError", report:"panelReport"}
    const tabs = ["tabGame","tabError","tabReport"]
    Object.values(panels).forEach(id => document.getElementById(id).classList.add("hidden"))
    tabs.forEach(id => {
        document.getElementById(id).className = "tab"
    })
    document.getElementById(panels[tab]).classList.remove("hidden")
    const active = tab === "game" ? "tabGame" : tab === "error" ? "tabError" : "tabReport"
    document.getElementById(active).className = "tab tab-active"
    if (tab === "error") renderErrorList()
    if (tab === "report") renderReport()
}

function factKey(q) {
    return `${q.a}${q.opt}${q.b}`
}

function allFacts(kind) {
    const out = []
    if (kind === "onlyAdd") {
        for (let a = 1; a <= 9; a++) {
            for (let b = 1; b <= 10 - a; b++) out.push({a, b, opt:"+", ans: a + b})
        }
        return out
    }
    if (kind === "onlySub") {
        for (let a = 2; a <= 10; a++) {
            for (let b = 1; b <= a; b++) out.push({a, b, opt:"-", ans: a - b})
        }
        return out
    }
    if (kind === "noCarryAdd") {
        for (let a = 10; a <= 18; a++) {
            const room = Math.min(9, 9 - (a % 10), 20 - a)
            for (let b = 1; b <= Math.max(1, room); b++) out.push({a, b, opt:"+", ans: a + b})
        }
        return out
    }
    if (kind === "noBorrowSub") {
        for (let a = 11; a <= 19; a++) {
            const ones = a % 10
            if (ones < 1) continue
            for (let b = 1; b <= ones; b++) out.push({a, b, opt:"-", ans: a - b})
        }
        return out
    }
    if (kind === "carryAdd") {
        for (let big = 6; big <= 9; big++) {
            const need = 10 - big
            for (let small = need + 1; small <= 9; small++) {
                out.push({a: big, b: small, opt:"+", ans: big + small})
            }
        }
        return out
    }
    if (kind === "borrowSub") {
        for (let a = 11; a <= 18; a++) {
            const ones = a % 10
            if (ones >= 9) continue
            for (let b = ones + 1; b <= 9; b++) out.push({a, b, opt:"-", ans: a - b})
        }
        return out
    }
    return allFacts("onlyAdd")
}

function makeQ(kind) {
    const pool = allFacts(kind)
    return pool[rand(0, pool.length - 1)]
}

function resolveKind(kind) {
    if (kind === "mix10") return Math.random() < 0.5 ? "onlyAdd" : "onlySub"
    if (kind === "mix20") return Math.random() < 0.5 ? "carryAdd" : "borrowSub"
    return kind
}

function tooSimilar(q, last) {
    if (!last || last.a == null) return false
    if (q.a === last.a) return true
    if (q.b === last.b) return true
    if (q.opt === "+" && last.opt === "+" && q.a === last.b && q.b === last.a) return true
    if (q.opt === last.opt && Math.abs(q.a - last.a) <= 1 && Math.abs(q.b - last.b) <= 1) return true
    return false
}

function pickFromPool(pool, usedSet, last) {
    if (!pool || !pool.length) return null
    const unused = pool.filter(q => !usedSet.has(factKey(q)))
    let cand = unused.length ? unused : pool.slice()
    const lastKey = last ? factKey(last) : ""
    const filters = [
        q => !tooSimilar(q, last),
        q => q.a !== (last && last.a) && q.b !== (last && last.b),
        q => q.a !== (last && last.a),
        q => factKey(q) !== lastKey
    ]
    for (let i = 0; i < filters.length; i++) {
        const next = cand.filter(filters[i])
        if (next.length) {
            cand = next
            break
        }
    }
    return cand[rand(0, cand.length - 1)]
}

function pickDiverse(kind, usedSet, last) {
    return pickFromPool(allFacts(resolveKind(kind)), usedSet, last)
}

function pickQuestion(kind) {
    return pickDiverse(kind, new Set(state.usedKeysInLv || []), {
        a: state.a, b: state.b, opt: state.opt
    })
}

function pickLevelQuestion() {
    const lv = levels[state.currentLv]
    let kinds = ["onlyAdd"]
    if (lv.onlyAdd) kinds = ["onlyAdd"]
    else if (lv.onlySub) kinds = ["onlySub"]
    else if (lv.mix10) kinds = ["onlyAdd", "onlySub"]
    else if (lv.noCarryAdd) kinds = ["noCarryAdd"]
    else if (lv.noBorrowSub) kinds = ["noBorrowSub"]
    else if (lv.carryAdd) kinds = ["carryAdd"]
    else if (lv.borrowSub) kinds = ["borrowSub"]
    else kinds = ["carryAdd", "borrowSub"]

    const used = new Set(state.usedKeysInLv || [])
    const open = kinds.filter(k => allFacts(k).some(q => !used.has(factKey(q))))
    const kind = (open.length ? open : kinds)[rand(0, (open.length ? open : kinds).length - 1)]
    return pickQuestion(kind)
}

function rememberLevelFact(q) {
    if (state.coachMode || state.fromError >= 0) return
    if (!Array.isArray(state.usedKeysInLv)) state.usedKeysInLv = []
    const k = factKey(q)
    if (!state.usedKeysInLv.includes(k)) state.usedKeysInLv.push(k)
}

function resetLevelFacts() {

}

function genQuestion() {
    let coachDone = false
    if (state.coachMode) {
        if (state.coachQueue && state.coachQueue.length) {
            const q = state.coachQueue.shift()
            saveData()
            const autoTip = !!q._firstTarget && (inferKind(q) === "carryAdd" || inferKind(q) === "borrowSub")
            showQuestion(q, {fromError: -1, autoTip})
            const left = state.coachQueue.length
            const roleText = {warm: "先热热身", target: "练练这道", practice: "同类练熟"}
            const tag = roleText[q._role] || "针对性练习"
            document.getElementById("levelInfo").innerText = left
                ? `小熊老师｜${tag}｜还剩${left + 1}题`
                : `小熊老师｜${tag}｜最后一题`
            return
        }
        state.coachMode = false
        coachDone = true
    }
    const q = pickLevelQuestion()
    showQuestion(q, {fromError: -1, autoTip: shouldAutoTip()})
    if (coachDone) document.getElementById("msg").innerText = "小熊安排的题练完啦，回到闯关"
}

function pressKey(k) {
    if (state.resolved) return
    if (k === "del") {
        state.input = state.input.slice(0, -1)
    } else if (k === "ok") {
        submitAnswer()
        return
    } else if (state.input.length < 2) {
        if (state.input === "0") state.input = k
        else state.input += k
    }
    document.getElementById("ansBox").innerText = state.input || "?"
}

function submitAnswer() {
    if (state.resolved) return
    if (!state.input) {
        const box = document.getElementById("ansBox")
        box.classList.remove("shake")
        void box.offsetWidth
        box.classList.add("shake")
        document.getElementById("msg").innerText = "先把得数填上再点对勾"
        return
    }
    const input = Number(state.input)
    const real = state.opt === "+" ? state.a + state.b : state.a - state.b
    state.ans = real
    const correct = input === real
    const box = document.getElementById("ansBox")
    const wasFirstTry = state.firstTry
    const practicingError = state.fromError >= 0

    if (wasFirstTry && state.fromError < 0) {
        logFirstAttempt(correct)
        state.todayCount++
        if (correct) {
            state.star++
            state.todayRight++
            if (!state.coachMode) state.rightInLv++
        } else {
            state.todayWrong++
            addError()
        }
        if (!state.coachMode) state.doneInLv++
        state.firstTry = false
        updateProgress()
        refreshTopUi()
        saveData()
    }

    if (correct) {
        state.resolved = true
        box.classList.remove("ans-bad")
        box.classList.add("ans-ok", "pop")
        const face = showReact(true)
        if (practicingError) {
            state.errorBook.splice(state.fromError, 1)
            state.fromError = -1
            saveData()
            document.getElementById("msg").innerText = `${face} 这道错题会了，移出错题本啦`
        } else {
            document.getElementById("msg").innerText = wasFirstTry ? `${face} 答对啦真棒！` : `${face} 看懂啦！就是这样算`
        }
        document.getElementById("btnNext").classList.remove("btn-next")
        document.getElementById("btnNext").classList.add("btn-next-ready")
        speak("答对啦")
        bounceMascot()
        const lv = levels[state.currentLv]
        if (!practicingError && !state.coachMode && state.doneInLv >= lv.max) {
            finishLevelOrRetry()
        } else {
            later(() => nextQuestion(false), 1400)
        }
    } else {
        box.classList.add("ans-bad", "shake")
        const face = showReact(false)
        document.getElementById("msg").innerText = `${face} 再看看十格图，想明白再填`
        speak("再想一想")
        showSolution(true)
        state.input = ""
        box.innerText = "?"
    }
}

            a: state.a, b: state.b, opt: state.opt, answer: state.ans

    }
}

function finishLevelOrRetry() {
    const lv = levels[state.currentLv]

    if (acc >= lv.targetAcc) {

        return
    }
    document.getElementById("msg").innerText = `正确率${(acc * 100).toFixed(0)}%，先把思路弄懂再重刷`
    state.doneInLv = 0
    state.rightInLv = 0
    resetLevelFacts()
    updateProgress()
    saveData()
    later(genQuestion, 1600)
}

function nextQuestion(manual) {
    if (!state.resolved && !manual) return
    if (!state.resolved && manual) {
        if (!confirm("这题还没做对，确定换一题吗？")) return
        if (state.firstTry && state.fromError < 0) {
            logFirstAttempt(false)
            state.todayCount++
            state.todayWrong++
            if (!state.coachMode) state.doneInLv++
            state.firstTry = false
            addError()
            updateProgress()
            refreshTopUi()
            saveData()
            const lv = levels[state.currentLv]
            if (!state.coachMode && state.doneInLv >= lv.max) {

    genQuestion()
}

function tenFrame(countA, countB, gone) {
    let html = '<div class="tenframe">'
    for (let i = 0; i < 10; i++) {
        let cls = "cell"
        if (i < gone) cls += " gone"
        else if (i < countA) cls += " a"
        else if (i < countA + countB) cls += " b"
        html += `<div class="${cls}"></div>`
    }
    return html + "</div>"
}
function framesForSub(n, gone) {
    const frames = n > 10 ? 2 : 1
    let html = ""
    for (let f = 0; f < frames; f++) {
        html += '<div class="tenframe">'
        for (let i = 0; i < 10; i++) {
            const idx = f * 10 + i
            let cls = "cell"
            if (idx < n - gone) cls += " a"
            else if (idx < n) cls += " gone"
            html += `<div class="${cls}"></div>`
        }
        html += "</div>"
    }
    return html
}
function framesFor(nA, nB, gone) {
    gone = gone || 0
    const total = nA + nB
    const firstA = Math.min(nA, 10)
    const firstB = Math.min(Math.max(0, 10 - nA), nB)
    const secondA = Math.max(0, nA - 10)
    const secondB = nB - firstB
    const gone1 = Math.min(gone, 10)
    const gone2 = Math.max(0, gone - 10)
    let html = tenFrame(firstA, firstB, gone1)
    if (total > 10 || nA > 10) html += tenFrame(secondA, secondB, gone2)
    return html
}
function dots(n) {
    return Array.from({length: n}, () => `<div class="dot"></div>`).join("")
}

function showSolution(play) {

    setSpeakStatus(true)
    const run = state.opt === "+"
        ? showAddAnimate(state.a, state.b, state.ans, play)
        : showSubAnimate(state.a, state.b, state.ans, play)

}

async function showAddAnimate(a, b, ans, play) {
    const my = ++aniToken
    const alive = () => my === aniToken
    const wait = (ms) => new Promise(r => later(r, play ? ms : 0))
    const say = async (text) => {
        if (!alive()) return
        if (state.sound) await speakOne(text)
        else await wait(play ? 700 : 0)
    }
    const big = Math.max(a, b)
    const small = Math.min(a, b)
    const need = 10 - big
    const carry = big < 10 && small > need && need > 0
    const lines = state.solutionLines

    document.getElementById("solutionAnimation").innerHTML =
        `<div class="block-item block-blue">${a}</div><span class="op">+</span><div class="block-item block-green">${b}</div>`

    if (!carry) {
        document.getElementById("solutionText").innerText = `算式：${a} + ${b}\n👉把两堆合在一起数`
        document.getElementById("framesWrap").innerHTML = framesFor(a, b, 0)
        document.getElementById("splitInfo").innerText = `${a} + ${b} = ${ans}`
        await speakLines(lines)
        return
    }

    document.getElementById("solutionText").innerText =
        `算式：${a} + ${b}\n👉凑十法：看大数、分小数、凑成十、加剩数`
    document.getElementById("framesWrap").innerHTML = framesFor(big, 0, 0)
    document.getElementById("tray").innerHTML = dots(small)
    await say(lines[0])
    if (!alive()) return
    await say(lines[1])
    if (!alive()) return
    const rest = small - need
    document.getElementById("framesWrap").innerHTML = framesFor(big, need, 0)
    document.getElementById("tray").innerHTML = dots(rest)
    document.getElementById("solutionAnimation").innerHTML = `
        <div class="block-item block-blue">${big}</div><span class="op">+</span>
        <div class="block-item block-amber">${need}</div><span class="op">+</span>
        <div class="block-item block-green">${rest}</div>`
    document.getElementById("splitInfo").innerText =
`${big} 还差 ${need} 就到 10
把 ${small} 分成 ${need} 和 ${rest}
${big} + ${need} = 10
10 + ${rest} = ${ans}`
    await say(lines[2])
    if (!alive()) return
    await say(lines[3])
    if (!alive()) return
    document.getElementById("framesWrap").innerHTML = framesFor(big, small, 0)
    document.getElementById("tray").innerHTML = ""
    await say(lines[4])
}

async function showSubAnimate(a, b, ans, play) {
    const my = ++aniToken
    const alive = () => my === aniToken
    const wait = (ms) => new Promise(r => later(r, play ? ms : 0))
    const say = async (text) => {
        if (!alive()) return
        if (state.sound) await speakOne(text)
        else await wait(play ? 700 : 0)
    }
    const ones = a % 10
    const borrow = ones > 0 && ones < b && b <= 9 && a >= 10
    const lines = state.solutionLines

    document.getElementById("solutionAnimation").innerHTML =
        `<div class="block-item block-blue">${a}</div><span class="op">−</span><div class="block-item block-rose">${b}</div>`

    if (!borrow) {
        document.getElementById("solutionText").innerText = `算式：${a} − ${b}\n👉从大堆里划掉 ${b} 个`
        document.getElementById("framesWrap").innerHTML = framesForSub(a, b)
        document.getElementById("splitInfo").innerText = `${a} − ${b} = ${ans}`
        await speakLines(lines)
        return
    }

    document.getElementById("solutionText").innerText =
        `算式：${a} − ${b}\n👉破十法：把十几分成 10 和几，先从 10 里减`
    document.getElementById("framesWrap").innerHTML = framesFor(10, 0, 0) + tenFrame(ones, 0, 0)
    await say(lines[0])
    if (!alive()) return
    await say(lines[1])
    if (!alive()) return
    document.getElementById("framesWrap").innerHTML = framesFor(10, 0, b) + tenFrame(ones, 0, 0)
    document.getElementById("solutionAnimation").innerHTML = `
        <div class="block-item block-amber">10</div><span class="op">+</span>
        <div class="block-item block-sky">${ones}</div><span class="op">−</span>
        <div class="block-item block-rose">${b}</div>`
    document.getElementById("splitInfo").innerText =
`个位 ${ones} 不够减 ${b}
把 ${a} 分成 10 和 ${ones}
10 − ${b} = ${10 - b}
${10 - b} + ${ones} = ${ans}

还可以想加算减：${b} + ${ans} = ${a}，所以 ${a} − ${b} = ${ans}`
    await say(lines[2])
    if (!alive()) return
    await say(lines[3])
    if (!alive()) return
    document.getElementById("framesWrap").innerHTML = framesFor(ans, 0, 0)
    await say(lines[4])
}

    state.todayLog.push({
        q: `${state.a}${state.opt}${state.b}`,
        a: state.a,
        b: state.b,
        opt: state.opt,
        correct: !!correct,
        hint: !!state.usedHint,
        lv: state.currentLv
    })
    if (state.todayLog.length > 80) state.todayLog = state.todayLog.slice(-80)
}

function parseFact(s) {
    const m = String(s || "").replace(/\s/g, "").match(/^(\d{1,2})([+\-])(\d{1,2})$/)
    if (!m) return null
    const a = +m[1], b = +m[3], opt = m[2]
    const ans = opt === "+" ? a + b : a - b
    if (a > 20 || b > 20 || ans < 0 || ans > 20) return null
    if (opt === "-" && a < b) return null
    return {a, b, opt, ans}
}

function kindFromLevel(i) {
    const lv = levels[i] || levels[0]
    if (lv.onlyAdd) return "onlyAdd"
    if (lv.onlySub) return "onlySub"
    if (lv.mix10) return "mix10"
    if (lv.noCarryAdd) return "noCarryAdd"
    if (lv.noBorrowSub) return "noBorrowSub"
    if (lv.carryAdd) return "carryAdd"
    if (lv.borrowSub) return "borrowSub"
    return "mix20"
}

function inferKind(item) {
    const a = +item.a, b = +item.b, op = item.opt
    if (op === "+") {
        const big = Math.max(a, b), small = Math.min(a, b)
        const need = 10 - big
        if (big < 10 && small > need && need > 0) return "carryAdd"
        if (a + b <= 10) return "onlyAdd"
        return "noCarryAdd"
    }
    const ones = a % 10
    if (ones > 0 && b > ones) return "borrowSub"
    if (a <= 10) return "onlySub"
    return "noBorrowSub"
}

function validCoachQ(q) {
    if (!q) return null
    const a = +q.a, b = +q.b, opt = q.opt
    const ans = opt === "+" ? a + b : a - b
    if (!Number.isFinite(a) || !Number.isFinite(b)) return null
    if (a < 0 || b < 0 || ans < 0 || ans > 20) return null
    if (opt === "-" && a < b) return null
    return {a, b, opt, ans}
}

function warmupsFor(q) {
    const kind = inferKind(q)
    const lv = state.currentLv
    const out = []
    if (kind === "carryAdd") {
        const big = Math.max(q.a, q.b)
        const small = Math.min(q.a, q.b)
        const need = 10 - big
        const rest = small - need
        out.push(validCoachQ({a: big, b: need, opt: "+"}))
        if (lv >= 3 && rest > 0) out.push(validCoachQ({a: 10, b: rest, opt: "+"}))
    } else if (kind === "borrowSub") {
        out.push(validCoachQ({a: 10, b: q.b, opt: "-"}))
        const ones = q.a % 10
        if (lv >= 4 && ones >= 1) out.push(validCoachQ({a: q.a, b: ones, opt: "-"}))
    } else if (kind === "onlyAdd") {
        const tens = allFacts("onlyAdd").filter(x => x.a + x.b === 10 && x.a !== q.a && x.b !== q.b)
        if (tens[0]) out.push(tens[0])
    } else if (kind === "onlySub") {
        if (q.a !== 10) out.push(validCoachQ({a: 10, b: Math.min(q.b, 9), opt: "-"}))
        else out.push(validCoachQ({a: 8, b: Math.min(q.b, 7), opt: "-"}))
    } else if (kind === "noCarryAdd") {
        const other = q.a === 12 ? 14 : 12
        out.push(validCoachQ({a: other, b: 1, opt: "+"}))
    } else if (kind === "noBorrowSub") {
        const other = q.a === 12 ? 15 : 12
        const ones = other % 10
        out.push(validCoachQ({a: other, b: 1, opt: "-"}))
    }
    return out.filter(Boolean)
}

function buildCoachQueue(plan, errorBook) {
    const seen = new Set()
    const queue = []
    const add = (q, role) => {
        q = validCoachQ(q)
        if (!q) return false
        const k = factKey(q)
        if (seen.has(k)) return false
        if (queue.length && tooSimilar(q, queue[queue.length - 1]) && role !== "target") {
            return false
        }
        seen.add(k)
        q._role = role || "practice"
        queue.push(q)
        return true
    }
    const addPicked = (kind, role) => add(pickDiverse(kind, seen, queue[queue.length - 1]), role)

    const seedSeen = new Set()
    const seeds = []
    const pushSeed = (q) => {
        q = validCoachQ(q)
        if (!q) return
        const k = factKey(q)
        if (seedSeen.has(k)) return
        seedSeen.add(k)
        seeds.push(q)
    }
    ;(plan && plan.weak_facts || []).forEach(f => pushSeed(parseFact(f)))
    ;(errorBook || []).forEach(x => pushSeed({a: x.a, b: x.b, opt: x.opt, ans: x.answer}))

    const RANK = {onlyAdd: 0, noCarryAdd: 1, carryAdd: 2, onlySub: 3, noBorrowSub: 4, borrowSub: 5}
    seeds.sort((a, b) => (RANK[inferKind(a)] ?? 9) - (RANK[inferKind(b)] ?? 9) || (a.a + a.b) - (b.a + b.b))

    const groups = {}
    seeds.forEach(q => {
        const k = inferKind(q)
        if (!groups[k]) groups[k] = []
        groups[k].push(q)
    })

    const allowed = ["onlyAdd", "onlySub", "noCarryAdd", "noBorrowSub", "carryAdd", "borrowSub"]
    let kinds = (plan && plan.tomorrow_kinds || [])
        .map(resolveKind)
        .filter(k => allowed.includes(k))
    const blockKinds = []
    Object.keys(RANK).forEach(k => {
        if (groups[k] || kinds.includes(k)) blockKinds.push(k)
    })
    if (!blockKinds.length) blockKinds.push(resolveKind(kindFromLevel(state.currentLv)))

    const quotas = blockKinds.length === 1 ? [10]
        : blockKinds.length === 2 ? [6, 4]
        : [4, 3, 3]

    let firstTarget = true
    blockKinds.forEach((kind, i) => {
        const quota = quotas[i] || 3
        const start = queue.length
        const seedList = groups[kind] || []
        if (seedList[0]) {
            warmupsFor(seedList[0]).forEach(w => {
                if (queue.length - start < quota) add(w, "warm")
            })
        }
        seedList.forEach(s => {
            if (queue.length >= 10) return
            if (add(s, "target") && firstTarget) {
                queue[queue.length - 1]._firstTarget = true
                firstTarget = false
            }
        })
        while (queue.length - start < quota && queue.length < 10) {
            if (!addPicked(kind, "practice")) break
        }
    })
    while (queue.length < 10) {
        if (!addPicked(blockKinds[blockKinds.length - 1], "practice")) break
    }
    return queue.slice(0, 10)
}

function localPlan() {
    const wrong = (state.todayLog || []).filter(x => !x.correct)
    const facts = []
    const seen = new Set()
    wrong.forEach(x => {
        if (x.q && !seen.has(x.q)) { seen.add(x.q); facts.push(x.q) }
    })
    state.errorBook.forEach(x => {
        if (x.question && !seen.has(x.question)) { seen.add(x.question); facts.push(x.question) }
    })
    const kinds = []
    wrong.forEach(x => {
        const k = inferKind(x)
        if (!kinds.includes(k)) kinds.push(k)
    })
    if (!kinds.length) kinds.push(kindFromLevel(state.currentLv))
    return {
        kid_line: facts.length ? `明天先练${facts[0]}，听完思路再填。` : "今天很认真，明天先听思路再做。",
        parent_note: facts.length
            ? `容易错：${facts.slice(0, 4).join("、")}。建议先听凑十/破十，再做针对性练习。`
            : "先按当前关卡练10道。听思路后再自己算。",
        weak_facts: facts.slice(0, 5),
        tomorrow_kinds: kinds.slice(0, 2),
        focus: kinds.includes("carryAdd") ? "凑十" : kinds.includes("borrowSub") ? "破十" : "口算",
        source: "local"
    }
}

function applyCoachPlan(plan) {
    state.coachPlan = plan
    saveData()
    renderCoach()
}

function renderCoach() {
    const kid = document.getElementById("coachKid")
    const parent = document.getElementById("coachParent")
    const status = document.getElementById("coachStatus")
    if (!kid) return
    const plan = state.coachPlan
    if (!plan) {
        kid.innerText = "今天练完后，让小熊看一看。"
        parent.innerText = ""
        status.innerText = ""
        return
    }
    kid.innerText = plan.kid_line || "今天很棒，明天再听一遍思路。"
    parent.innerText = plan.parent_note || ""
    const extra = []
    if (plan.focus) extra.push("重点：" + plan.focus)
    if (plan.weak_facts && plan.weak_facts.length) extra.push("要练：" + plan.weak_facts.join("、"))
    if (plan.source === "ai") extra.push("小熊已经看过今天的练习")
    else extra.push("还没连上小熊，先按错题安排")
    status.innerText = extra.join(" ｜ ")
}

async function askBear() {
    if (!state.todayCount && !(state.todayLog && state.todayLog.length) && !state.errorBook.length) {
        alert("今天还没做题，先练几道再让小熊看。")
        return
    }
    const btn = document.getElementById("btnAnalyze")
    const status = document.getElementById("coachStatus")
    btn.disabled = true
    status.innerText = "小熊正在看今天的练习…"
    const payload = {
        todayCount: state.todayCount,
        todayRight: state.todayRight,
        todayWrong: state.todayWrong,
        currentLv: state.currentLv,
        levelName: levels[state.currentLv].name,
        log: (state.todayLog || []).slice(-80),
        errorBook: state.errorBook.slice(0, 20).map(x => ({
            question: x.question, a: x.a, b: x.b, opt: x.opt
        }))
    }
    try {
        const res = await fetch("/api/analyze", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || "分析失败")
        applyCoachPlan(data)
        speak(data.kid_line || "明天先听思路再做")
    } catch (e) {
        applyCoachPlan(localPlan())
        document.getElementById("coachStatus").innerText =
            "网页要从小熊老师的地址打开才能连上。先按错题安排了，也可以本机运行 python server.py 后再点分析。"
    }
    btn.disabled = false
}

function startCoachPractice() {
    const plan = state.coachPlan
    if (!plan && !state.errorBook.length) {
        alert("先点「小熊分析」，或先做几题留下错题。")
        return
    }
    state.coachQueue = buildCoachQueue(plan, state.errorBook)
    if (!state.coachQueue.length) {
        alert("暂时排不出练习，先做几题再让小熊看。")
        return
    }
    state.coachMode = true
    saveData()
    switchTab("game")
    genQuestion()
}

function renderReport() {
    document.getElementById("repTotal").innerText = state.todayCount
    document.getElementById("repRight").innerText = state.todayRight
    document.getElementById("repWrong").innerText = state.todayWrong
    const acc = state.todayCount > 0 ? (state.todayRight / state.todayCount * 100).toFixed(0) : 0
    document.getElementById("repAcc").innerText = acc + "%"
    document.getElementById("repLv").innerText = state.currentLv + 1
    document.getElementById("repErr").innerText = state.errorBook.length
    document.getElementById("parentLv").value = String(state.currentLv)
    document.getElementById("soundChk").checked = !!state.sound
    renderCoach()
}

function buildKeypad() {
    const keys = ["1","2","3","4","5","6","7","8","9","del","0","ok"]
    const labels = {del:"⌫", ok:"✓"}
    document.getElementById("keypad").innerHTML = keys.map(k => {
        const extra = k === "ok" ? "key-ok" : k === "del" ? "key-del" : ""
        return `<button class="key ${extra}" onclick="pressKey('${k}')">${labels[k] || k}</button>`
    }).join("")
}

document.addEventListener("keydown", (e) => {
    if (document.getElementById("panelGame").classList.contains("hidden")) return
    if (e.key >= "0" && e.key <= "9") pressKey(e.key)
    else if (e.key === "Backspace") pressKey("del")
    else if (e.key === "Enter") pressKey("ok")
})

buildKeypad()
loadData()
if (!state.todayDate) state.todayDate = todayStr()
if (window.speechSynthesis) {
    speechSynthesis.getVoices()
    speechSynthesis.onvoiceschanged = function () { fillVoiceSelect() }
}
fetch("/api/health").then(function (r) { return r.json() }).then(function (d) {
    bearTts = !!d.has_tts
    if (bearTts) state.voiceName = "xfyun"
    fillVoiceSelect()
}).catch(function () { fillVoiceSelect() })
function unlockSpeechOnce() {
    try {
        ttsPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"
        ttsPlayer.play().catch(function () {})
    } catch (e) {}
    if (!window.speechSynthesis) return
    kickSpeech()
    speechSynthesis.getVoices()
    fillVoiceSelect()
    const u = new SpeechSynthesisUtterance(" ")
    u.volume = 0
    u.lang = "zh-CN"
    spokenUtterances.push(u)
    try { speechSynthesis.speak(u) } catch (e) {}
    try { speechSynthesis.resume() } catch (e) {}
}
document.addEventListener("touchstart", unlockSpeechOnce, { once: true })
document.addEventListener("click", unlockSpeechOnce, { once: true })
refreshUi()
genQuestion()
