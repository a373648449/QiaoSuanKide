<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f9ff">
    <title>20以内｜凑十破十动画版</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
    <div class="hero">
        <button type="button" class="mascot" id="mascotBtn" onclick="cheerMascot()" title="点我抱抱">
            <img src="hug.gif" alt="抱抱小熊">
        </button>
        <div>
            <h1 class="title">20以内数学闯关</h1>
            <p class="hero-tip">点小熊会给你加油</p>
        </div>
    </div>

    <div class="status">
        <span>⭐星星：<span id="star">0</span></span>
        <span>今日：<span id="todayCount">0</span></span>
    </div>

    <div class="level-pick">
        <span>换关卡</span>
        <select id="parentLv" onchange="jumpLevel(+this.value)"></select>
    </div>

    <div class="tabs">
        <button onclick="switchTab('game')" id="tabGame" class="tab tab-active">练习闯关</button>
        <button onclick="switchTab('error')" id="tabError" class="tab">📒错题本</button>
        <button onclick="switchTab('report')" id="tabReport" class="tab">📊今日报告</button>
    </div>

    <div id="panelGame">
        <div id="levelInfo" class="level-info"></div>
        <div class="progress-track">
            <div id="progress" class="progress-bar"></div>
        </div>

        <div class="play-board">
            <div class="play-q">
                <div id="story" class="story"></div>
                <div id="qBox" class="equation"></div>
                <div class="ans-wrap">
                    <div id="ansBox" class="ans-box">?</div>
                </div>
                <div id="msg" class="msg"></div>
            </div>
            <div class="play-keys">
                <div class="keypad" id="keypad"></div>
                <div class="actions">
                    <button onclick="showSolution(true)" class="btn btn-hint">解题思路</button>
                    <button onclick="nextQuestion(true)" id="btnNext" class="btn btn-next">下一题</button>
                </div>
            </div>
        </div>

        <div id="tipBox" class="tip hidden">
            <div id="solutionText" class="solution-text"></div>
            <div id="framesWrap" class="frames"></div>
            <div id="tray" class="tray"></div>
            <div id="solutionAnimation" class="solution-blocks"></div>
            <div id="splitInfo" class="split-info"></div>
        </div>
    </div>

    <div id="panelError" class="hidden">
        <h2 class="panel-title">📒错题本</h2>
        <p class="hint">先自己再做一遍。想不起来再看思路，做对就会移走。</p>
        <div id="errorList" class="error-list"></div>
        <div id="errorEmpty" class="error-empty">暂时还没有错题，加油💪</div>
        <button onclick="clearAllError()" class="btn-clear">清空全部错题</button>
    </div>

    <div id="panelReport" class="hidden">
        <h2 class="panel-title">📊今日学习报告</h2>
        <div class="report-list">
            <div class="report-item slate">今日总题数：<span id="repTotal">0</span></div>
            <div class="report-item green">答对：<span id="repRight">0</span></div>
            <div class="report-item rose">答错：<span id="repWrong">0</span></div>
            <div class="report-item amber">今日正确率：<span id="repAcc">0%</span></div>
            <div class="report-item blue">当前闯关进度：第<span id="repLv">1</span>关</div>
            <div class="report-item orange">错题本还剩：<span id="repErr">0</span>道</div>
        </div>
        <div class="parent-box">
            <label class="check-row">
                <input id="soundChk" type="checkbox" onchange="toggleSound(this.checked)"> 读出题目
            </label>
            <button type="button" class="btn-reset" onclick="resetAllProgress()">一键清空全部进度</button>
            <p class="parent-tip">会清掉星星、关卡、今日记录和错题本，方便重新练。</p>
        </div>
        <div class="note">每天看一眼正确率和错题。想练多久都可以，累了再停。</div>
    </div>

    <div id="rewardPop" class="modal hidden">
        <div class="modal-card">
            <img class="reward-gif" src="hug.gif" alt="抱抱小熊">
            <h3 class="panel-title">关卡通关！</h3>
            <p id="rewardText"></p>
            <button onclick="closeReward()" class="btn-continue">继续闯关</button>
        </div>
    </div>
</div>

<script>
const levels = [
    {name:"10以内加法", max:10, targetAcc:0.8, onlyAdd:true},
    {name:"10以内减法", max:10, targetAcc:0.8, onlySub:true},
    {name:"10以内加减混合", max:12, targetAcc:0.8, mix10:true},
    {name:"20以内不进位加法", max:12, targetAcc:0.8, noCarryAdd:true},
    {name:"20以内不退位减法", max:12, targetAcc:0.8, noBorrowSub:true},
    {name:"20以内进位加法【凑十法】", max:15, targetAcc:0.8, carryAdd:true},
    {name:"20以内退位减法【破十法】", max:15, targetAcc:0.8, borrowSub:true},
    {name:"20以内进退位混合挑战", max:18, targetAcc:0.75, mix20:true}
]

let state = {
    star: 0,
    currentLv: 0,
    doneInLv: 0,
    rightInLv: 0,
    todayCount: 0,
    todayRight: 0,
    todayWrong: 0,
    todayDate: "",
    errorBook: [],
    sound: true,
    allClear: false,
    a: 0, b: 0, opt: "+", ans: 0,
    input: "",
    firstTry: true,
    resolved: false,
    fromError: -1,
    lastKey: ""
}

let aniToken = 0
const timers = []

function todayStr() {
    const d = new Date()
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
}
function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min
}
function later(fn, ms) {
    const id = setTimeout(fn, ms)
    timers.push(id)
    return id
}
function clearTimers() {
    timers.splice(0).forEach(clearTimeout)
    aniToken++
}
function saveData() {
    const {input, firstTry, resolved, fromError, ...rest} = state
    localStorage.setItem("math20data", JSON.stringify(rest))
}
function loadData() {
    const str = localStorage.getItem("math20data")
    if (!str) return
    try {
        const d = JSON.parse(str)
        state = {...state, ...d}
    } catch (e) {}
    if (state.todayDate !== todayStr()) {
        state.todayCount = 0
        state.todayRight = 0
        state.todayWrong = 0
        state.todayDate = todayStr()
    }
    if (state.currentLv >= levels.length) {
        state.currentLv = levels.length - 1
        state.allClear = true
    }
}

function speak(text) {
    if (!state.sound || !window.speechSynthesis) return
    const u = new SpeechSynthesisUtterance(text)
    u.lang = "zh-CN"
    u.rate = 0.92
    speechSynthesis.cancel()
    speechSynthesis.speak(u)
}

function switchTab(tab) {
    const panels = {game:"panelGame", error:"panelError", report:"panelReport"}
    const tabs = ["tabGame","tabError","tabReport"]
    Object.values(panels).forEach(id => document.getElementById(id).classList.add("hidden"))
    tabs.forEach(id => {
        document.getElementById(id).className = "tab"
    })
    document.getElementById(panels[tab]).classList.remove("hidden")
    const active = tab === "game" ? "tabGame" : tab === "error" ? "tabError" : "tabReport"
    document.getElementById(active).className = "tab tab-active"
    if (tab === "error") renderErrorList()
    if (tab === "report") renderReport()
}

function makeQ(kind) {
    if (kind === "onlyAdd") {
        const a = rand(1, 9)
        const b = rand(1, 10 - a)
        return {a, b, opt:"+", ans: a + b}
    }
    if (kind === "onlySub") {
        const a = rand(2, 10)
        const b = rand(1, a)
        return {a, b, opt:"-", ans: a - b}
    }
    if (kind === "noCarryAdd") {
        const a = rand(10, 18)
        const room = Math.min(9, 9 - (a % 10), 20 - a)
        const b = rand(1, Math.max(1, room))
        return {a, b, opt:"+", ans: a + b}
    }
    if (kind === "noBorrowSub") {
        const a = rand(11, 19)
        const ones = a % 10
        if (ones < 1) return makeQ(kind)
        const b = rand(1, ones)
        return {a, b, opt:"-", ans: a - b}
    }
    if (kind === "carryAdd") {
        const big = rand(6, 9)
        const need = 10 - big
        const small = rand(need + 1, 9)
        return {a: big, b: small, opt:"+", ans: big + small}
    }
    if (kind === "borrowSub") {
        const a = rand(11, 18)
        const ones = a % 10
        if (ones >= 9) return makeQ(kind)
        const b = rand(ones + 1, 9)
        return {a, b, opt:"-", ans: a - b}
    }
    return makeQ("onlyAdd")
}

function genQuestion() {
    const lv = levels[state.currentLv]
    let q
    for (let i = 0; i < 30; i++) {
        if (lv.onlyAdd) q = makeQ("onlyAdd")
        else if (lv.onlySub) q = makeQ("onlySub")
        else if (lv.mix10) q = Math.random() < 0.5 ? makeQ("onlyAdd") : makeQ("onlySub")
        else if (lv.noCarryAdd) q = makeQ("noCarryAdd")
        else if (lv.noBorrowSub) q = makeQ("noBorrowSub")
        else if (lv.carryAdd) q = makeQ("carryAdd")
        else if (lv.borrowSub) q = makeQ("borrowSub")
        else q = Math.random() < 0.5 ? makeQ("carryAdd") : makeQ("borrowSub")
        const key = `${q.a}${q.opt}${q.b}`
        if (key !== state.lastKey) break
    }
    showQuestion(q, {fromError: -1, autoTip: shouldAutoTip()})
}

function shouldAutoTip() {
    const lv = levels[state.currentLv]
    return (lv.carryAdd || lv.borrowSub) && state.doneInLv < 2
}

function storyFor(q) {
    if (q.opt === "+") return `抱抱小熊有 ${q.a} 颗草莓，又摘了 ${q.b} 颗`
    return `抱抱小熊有 ${q.a} 颗草莓，吃掉了 ${q.b} 颗`
}

function cheerMascot() {
    const btn = document.getElementById("mascotBtn")
    btn.classList.remove("cheer")
    void btn.offsetWidth
    btn.classList.add("cheer")
    const words = ["加油，你最棒！", "抱抱小熊给你鼓劲！", "再做一题，你能行！"]
    speak(words[rand(0, words.length - 1)])
}

function bounceMascot() {
    const btn = document.getElementById("mascotBtn")
    btn.classList.remove("cheer")
    void btn.offsetWidth
    btn.classList.add("cheer")
}

function showQuestion(q, opts) {
    clearTimers()
    state.a = q.a
    state.b = q.b
    state.opt = q.opt
    state.ans = q.ans
    state.input = ""
    state.firstTry = true
    state.resolved = false
    state.fromError = opts.fromError
    state.lastKey = `${q.a}${q.opt}${q.b}`
    document.getElementById("qBox").innerText = `${q.a} ${q.opt} ${q.b} = ?`
    document.getElementById("story").innerText = storyFor(q)
    document.getElementById("ansBox").innerText = "?"
    document.getElementById("ansBox").classList.remove("shake", "ans-ok", "ans-bad")
    document.getElementById("ansBox").classList.add("ans-box")
    document.getElementById("msg").innerText = ""
    document.getElementById("tipBox").classList.add("hidden")
    document.getElementById("btnNext").classList.remove("btn-next-ready")
    document.getElementById("btnNext").classList.add("btn-next")
    speak(`${q.a} ${q.opt === "+" ? "加" : "减"} ${q.b} 等于几`)
    if (opts.autoTip) showSolution(false)
    saveData()
}

function pressKey(k) {
    if (state.resolved) return
    if (k === "del") {
        state.input = state.input.slice(0, -1)
    } else if (k === "ok") {
        submitAnswer()
        return
    } else if (state.input.length < 2) {
        if (state.input === "0") state.input = k
        else state.input += k
    }
    document.getElementById("ansBox").innerText = state.input || "?"
}

function submitAnswer() {
    if (state.resolved) return
    if (!state.input) {
        const box = document.getElementById("ansBox")
        box.classList.remove("shake")
        void box.offsetWidth
        box.classList.add("shake")
        document.getElementById("msg").innerText = "先把得数填上再点对勾"
        return
    }
    const input = Number(state.input)
    const real = state.opt === "+" ? state.a + state.b : state.a - state.b
    state.ans = real
    const correct = input === real
    const box = document.getElementById("ansBox")
    const wasFirstTry = state.firstTry
    const practicingError = state.fromError >= 0

    if (wasFirstTry && state.fromError < 0) {
        state.todayCount++
        state.doneInLv++
        if (correct) {
            state.star++
            state.rightInLv++
            state.todayRight++
        } else {
            state.todayWrong++
            addError()
        }
        state.firstTry = false
        updateProgress()
        refreshTopUi()
        saveData()
    }

    if (correct) {
        state.resolved = true
        box.classList.remove("ans-bad")
        box.classList.add("ans-ok", "pop")
        if (practicingError) {
            state.errorBook.splice(state.fromError, 1)
            state.fromError = -1
            saveData()
            document.getElementById("msg").innerText = "这道错题会了，移出错题本啦"
        } else {
            document.getElementById("msg").innerText = wasFirstTry ? "答对啦⭐真棒！" : "看懂啦！就是这样算"
        }
        document.getElementById("btnNext").classList.remove("btn-next")
        document.getElementById("btnNext").classList.add("btn-next-ready")
        speak("答对了")
        bounceMascot()
        const lv = levels[state.currentLv]
        if (!practicingError && state.doneInLv >= lv.max) {
            finishLevelOrRetry()
        } else {
            later(() => nextQuestion(false), 1400)
        }
    } else {
        box.classList.add("ans-bad", "shake")
        document.getElementById("msg").innerText = "再看看十格图，想明白再填"
        speak("再想想")
        showSolution(true)
        state.input = ""
        box.innerText = "?"
    }
}

function addError() {
    const qstr = `${state.a}${state.opt}${state.b}`
    if (!state.errorBook.some(x => x.question === qstr)) {
        state.errorBook.push({
            question: qstr,
            a: state.a, b: state.b, opt: state.opt, answer: state.ans
        })
    }
}

function finishLevelOrRetry() {
    const lv = levels[state.currentLv]
    const acc = state.rightInLv / state.doneInLv
    if (acc >= lv.targetAcc) {
        later(levelPass, 800)
        return
    }
    document.getElementById("msg").innerText = `正确率${(acc * 100).toFixed(0)}%，先把思路弄懂再重刷`
    state.doneInLv = 0
    state.rightInLv = 0
    updateProgress()
    saveData()
    later(genQuestion, 1600)
}

function updateProgress() {
    const lv = levels[state.currentLv]
    const pct = Math.min(100, (state.doneInLv / lv.max) * 100)
    document.getElementById("progress").style.width = pct + "%"
}

function levelPass() {
    state.star += 5
    saveData()
    refreshTopUi()
    document.getElementById("rewardText").innerText = "恭喜！学会本关的计算思路"
    document.getElementById("rewardPop").classList.remove("hidden")
}

function closeReward() {
    document.getElementById("rewardPop").classList.add("hidden")
    if (state.currentLv >= levels.length - 1) {
        state.allClear = true
        document.getElementById("msg").innerText = "🎉全部关卡通关！可以去错题本把不会的再练熟"
        saveData()
        return
    }
    state.currentLv++
    state.doneInLv = 0
    state.rightInLv = 0
    refreshUi()
    genQuestion()
    saveData()
}

function nextQuestion(manual) {
    if (!state.resolved && !manual) return
    if (!state.resolved && manual) {
        if (!confirm("这题还没做对，确定换一题吗？")) return
        if (state.firstTry && state.fromError < 0) {
            state.todayCount++
            state.todayWrong++
            state.doneInLv++
            state.firstTry = false
            addError()
            updateProgress()
            refreshTopUi()
            saveData()
            const lv = levels[state.currentLv]
            if (state.doneInLv >= lv.max) {
                finishLevelOrRetry()
                return
            }
        }
    }
    genQuestion()
}

function refreshTopUi() {
    document.getElementById("star").innerText = state.star
    document.getElementById("todayCount").innerText = state.todayCount
}
function refreshUi() {
    refreshTopUi()
    const lv = levels[state.currentLv]
    document.getElementById("levelInfo").innerText = `${lv.name}｜先弄懂思路再做题`
    updateProgress()
    const sel = document.getElementById("parentLv")
    sel.innerHTML = levels.map((l, i) => `<option value="${i}">第${i + 1}关 ${l.name}</option>`).join("")
    sel.value = String(state.currentLv)
    document.getElementById("soundChk").checked = !!state.sound
}

function jumpLevel(i) {
    state.currentLv = i
    state.doneInLv = 0
    state.rightInLv = 0
    state.allClear = false
    refreshUi()
    switchTab("game")
    genQuestion()
    saveData()
}
function toggleSound(on) {
    state.sound = on
    saveData()
}

function tenFrame(countA, countB, gone) {
    let html = '<div class="tenframe">'
    for (let i = 0; i < 10; i++) {
        let cls = "cell"
        if (i < gone) cls += " gone"
        else if (i < countA) cls += " a"
        else if (i < countA + countB) cls += " b"
        html += `<div class="${cls}"></div>`
    }
    return html + "</div>"
}
function framesForSub(n, gone) {
    const frames = n > 10 ? 2 : 1
    let html = ""
    for (let f = 0; f < frames; f++) {
        html += '<div class="tenframe">'
        for (let i = 0; i < 10; i++) {
            const idx = f * 10 + i
            let cls = "cell"
            if (idx < n - gone) cls += " a"
            else if (idx < n) cls += " gone"
            html += `<div class="${cls}"></div>`
        }
        html += "</div>"
    }
    return html
}
function framesFor(nA, nB, gone) {
    gone = gone || 0
    const total = nA + nB
    const firstA = Math.min(nA, 10)
    const firstB = Math.min(Math.max(0, 10 - nA), nB)
    const secondA = Math.max(0, nA - 10)
    const secondB = nB - firstB
    const gone1 = Math.min(gone, 10)
    const gone2 = Math.max(0, gone - 10)
    let html = tenFrame(firstA, firstB, gone1)
    if (total > 10 || nA > 10) html += tenFrame(secondA, secondB, gone2)
    return html
}
function dots(n) {
    return Array.from({length: n}, () => `<div class="dot"></div>`).join("")
}

function showSolution(play) {
    const box = document.getElementById("tipBox")
    box.classList.remove("hidden")
    document.getElementById("splitInfo").innerText = ""
    document.getElementById("solutionAnimation").innerHTML = ""
    document.getElementById("tray").innerHTML = ""
    if (state.opt === "+") showAddAnimate(state.a, state.b, state.ans, play)
    else showSubAnimate(state.a, state.b, state.ans, play)
}

async function showAddAnimate(a, b, ans, play) {
    const my = ++aniToken
    const alive = () => my === aniToken
    const wait = (ms) => new Promise(r => later(r, play ? ms : 0))
    const big = Math.max(a, b)
    const small = Math.min(a, b)
    const need = 10 - big
    const carry = big < 10 && small > need && need > 0

    document.getElementById("solutionAnimation").innerHTML =
        `<div class="block-item block-blue">${a}</div><span class="op">+</span><div class="block-item block-green">${b}</div>`

    if (!carry) {
        document.getElementById("solutionText").innerText = `算式：${a} + ${b}\n👉把两堆合在一起数`
        document.getElementById("framesWrap").innerHTML = framesFor(a, b, 0)
        document.getElementById("splitInfo").innerText = `${a} + ${b} = ${ans}`
        return
    }

    document.getElementById("solutionText").innerText =
        `算式：${a} + ${b}\n👉凑十法：看大数、分小数、凑成十、加剩数`
    document.getElementById("framesWrap").innerHTML = framesFor(big, 0, 0)
    document.getElementById("tray").innerHTML = dots(small)
    await wait(700)
    if (!alive()) return
    const rest = small - need
    document.getElementById("framesWrap").innerHTML = framesFor(big, need, 0)
    document.getElementById("tray").innerHTML = dots(rest)
    document.getElementById("solutionAnimation").innerHTML = `
        <div class="block-item block-blue">${big}</div><span class="op">+</span>
        <div class="block-item block-amber">${need}</div><span class="op">+</span>
        <div class="block-item block-green">${rest}</div>`
    document.getElementById("splitInfo").innerText =
`${big} 还差 ${need} 就到 10
把 ${small} 分成 ${need} 和 ${rest}
${big} + ${need} = 10
10 + ${rest} = ${ans}`
    await wait(700)
    if (!alive()) return
    document.getElementById("framesWrap").innerHTML = framesFor(big, small, 0)
    document.getElementById("tray").innerHTML = ""
}

async function showSubAnimate(a, b, ans, play) {
    const my = ++aniToken
    const alive = () => my === aniToken
    const wait = (ms) => new Promise(r => later(r, play ? ms : 0))
    const ones = a % 10
    const borrow = ones < b && b <= 9 && a >= 10

    document.getElementById("solutionAnimation").innerHTML =
        `<div class="block-item block-blue">${a}</div><span class="op">−</span><div class="block-item block-rose">${b}</div>`

    if (!borrow) {
        document.getElementById("solutionText").innerText = `算式：${a} − ${b}\n👉从大堆里划掉 ${b} 个`
        document.getElementById("framesWrap").innerHTML = framesForSub(a, b)
        document.getElementById("splitInfo").innerText = `${a} − ${b} = ${ans}`
        return
    }

    document.getElementById("solutionText").innerText =
        `算式：${a} − ${b}\n👉破十法：把十几分成 10 和几，先从 10 里减`
    document.getElementById("framesWrap").innerHTML = framesFor(10, 0, 0) + tenFrame(ones, 0, 0)
    await wait(700)
    if (!alive()) return
    document.getElementById("framesWrap").innerHTML = framesFor(10, 0, b) + tenFrame(ones, 0, 0)
    document.getElementById("solutionAnimation").innerHTML = `
        <div class="block-item block-amber">10</div><span class="op">+</span>
        <div class="block-item block-sky">${ones}</div><span class="op">−</span>
        <div class="block-item block-rose">${b}</div>`
    document.getElementById("splitInfo").innerText =
`个位 ${ones} 不够减 ${b}
把 ${a} 分成 10 和 ${ones}
10 − ${b} = ${10 - b}
${10 - b} + ${ones} = ${ans}

还可以想加算减：${b} + ${ans} = ${a}，所以 ${a} − ${b} = ${ans}`
    await wait(700)
    if (!alive()) return
    document.getElementById("framesWrap").innerHTML = framesFor(ans, 0, 0)
}

function renderErrorList() {
    const wrap = document.getElementById("errorList")
    const empty = document.getElementById("errorEmpty")
    if (state.errorBook.length === 0) {
        wrap.innerHTML = ""
        empty.classList.remove("hidden")
        return
    }
    empty.classList.add("hidden")
    wrap.innerHTML = state.errorBook.map((item, idx) => `
        <div class="error-item">
            <span class="error-q">${item.a} ${item.opt} ${item.b} = ?</span>
            <div class="error-actions">
                <button onclick="practiceError(${idx}, false)" class="btn-sm btn-sm-primary">再练</button>
                <button onclick="practiceError(${idx}, true)" class="btn-sm btn-sm-hint">看思路</button>
            </div>
        </div>
    `).join("")
}

function practiceError(idx, autoTip) {
    const item = state.errorBook[idx]
    switchTab("game")
    showQuestion(
        {a: item.a, b: item.b, opt: item.opt, ans: item.answer},
        {fromError: idx, autoTip}
    )
}

function clearAllError() {
    if (confirm("确定清空全部错题吗？")) {
        state.errorBook = []
        saveData()
        renderErrorList()
        renderReport()
    }
}

function resetAllProgress() {
    if (!confirm("确定清空全部进度吗？星星、关卡、今日记录和错题本都会清掉。")) return
    state.star = 0
    state.currentLv = 0
    state.doneInLv = 0
    state.rightInLv = 0
    state.todayCount = 0
    state.todayRight = 0
    state.todayWrong = 0
    state.errorBook = []
    state.allClear = false
    state.fromError = -1
    saveData()
    refreshUi()
    renderReport()
    renderErrorList()
    genQuestion()
    alert("已经全部清空，可以从第1关重新练习。")
}

function renderReport() {
    document.getElementById("repTotal").innerText = state.todayCount
    document.getElementById("repRight").innerText = state.todayRight
    document.getElementById("repWrong").innerText = state.todayWrong
    const acc = state.todayCount > 0 ? (state.todayRight / state.todayCount * 100).toFixed(0) : 0
    document.getElementById("repAcc").innerText = acc + "%"
    document.getElementById("repLv").innerText = state.currentLv + 1
    document.getElementById("repErr").innerText = state.errorBook.length
    document.getElementById("parentLv").value = String(state.currentLv)
    document.getElementById("soundChk").checked = !!state.sound
}

function buildKeypad() {
    const keys = ["1","2","3","4","5","6","7","8","9","del","0","ok"]
    const labels = {del:"⌫", ok:"✓"}
    document.getElementById("keypad").innerHTML = keys.map(k => {
        const extra = k === "ok" ? "key-ok" : k === "del" ? "key-del" : ""
        return `<button class="key ${extra}" onclick="pressKey('${k}')">${labels[k] || k}</button>`
    }).join("")
}

document.addEventListener("keydown", (e) => {
    if (document.getElementById("panelGame").classList.contains("hidden")) return
    if (e.key >= "0" && e.key <= "9") pressKey(e.key)
    else if (e.key === "Backspace") pressKey("del")
    else if (e.key === "Enter") pressKey("ok")
})

buildKeypad()
loadData()
if (!state.todayDate) state.todayDate = todayStr()
refreshUi()
genQuestion()
</script>
